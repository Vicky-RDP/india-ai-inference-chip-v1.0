name: Reproducible hardware CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Reference, RTL, and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install simulator
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y iverilog
      - name: Run the complete local gate
        run: make ci

