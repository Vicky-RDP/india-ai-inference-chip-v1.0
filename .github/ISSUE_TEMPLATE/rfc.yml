name: Request for comments
description: Propose an architecture, interface, policy, or roadmap change.
title: "[RFC]: "
labels: [design discussion, needs-triage]
body:
  - type: textarea
    id: context
    attributes:
      label: Context and problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed design
      description: Include interfaces, timing, numeric behavior, and user impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and success criteria
      description: How will we know this is correct, useful, and safe?
    validations:
      required: true
  - type: textarea
    id: rollout
    attributes:
      label: Migration and rollout plan

